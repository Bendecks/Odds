name: ChatGPT Push Engine

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'data/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-push-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-engines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run V6/V7 Expansion Engine
        run: python scripts/v6_expansion_engine.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}

      - name: Apply V10 Adaptive Feedback
        run: python scripts/v10_apply_feedback.py

      - name: Run Paper Tracker
        run: python scripts/paper_tracker.py

      - name: Run Paper Auto Settler
        run: python scripts/paper_auto_settler.py
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

      - name: Apply Manual Result Patch
        run: python scripts/manual_result_patch.py

      - name: Run V9 Feedback
        run: python scripts/v9_performance_feedback.py

      - name: Commit active outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/v6_expansion_engine.* output/odds_cache_raw.json output/paper_*.json output/paper_*.md output/v9_* || true
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update active outputs after ChatGPT push"
          git pull --rebase origin main
          git push
