name: ChatGPT Push Engine

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'data/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-push-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-engines:
    # Avoid infinite loops when the workflow itself commits output files.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run V4 Market Engine
        run: python scripts/v4_market_engine.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

      - name: Run Data Hunter V2/V3
        run: python scripts/data_hunter_v2.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Commit engine outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/v4_market_engine.* output/data_hunter_v2.* || true
          git diff --cached --quiet || git commit -m "Auto-update engine outputs after ChatGPT push"
          git push
