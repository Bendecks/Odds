name: Deploy Odds Lab Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact public status
        run: |
          python scripts/model_validation_readiness.py
          python scripts/paper_pick_history.py
          PYTHONPATH=scripts python scripts/operational_status.py
          PYTHONPATH=scripts python scripts/reference_quality_shadow.py
      - uses: actions/configure-pages@v5
      - name: Stage public site only
        run: |
          mkdir -p _site/output
          cp index.html styles.css app.js _site/
          cp output/latest_decision.json output/model_validation_readiness.json output/paper_pick_history.json output/operational_status.json output/development_status.json _site/output/
          cp output/devig_shadow_comparison.json _site/output/ 2>/dev/null || true
          cp output/reference_quality_shadow.json _site/output/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
