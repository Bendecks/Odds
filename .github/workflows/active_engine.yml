name: Active Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'

permissions:
  contents: write

concurrency:
  group: active-engine
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Sync latest main
        run: git pull --rebase --autostash origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run engine
        run: python scripts/v6_expansion_engine.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THE_ODDS_API_KEY: ''
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          MAX_HOURS: 36
          ODDS_IO_SPORTS: football
          ODDS_IO_MAX_EVENTS: 25
          THEODDS_SPORTS: ''
      - name: Apply V10 feedback
        run: python scripts/v10_apply_feedback.py
      - name: Apply strict mode
        run: python scripts/strict_mode.py
      - name: Commit engine outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A output/v6_expansion_engine.* output/odds_cache_raw.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Update active engine outputs"
          git push
