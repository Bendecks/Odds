name: Active Engine

# Automatic/scheduled trigger disabled to prevent GitHub Actions usage.
# Run manually from the Actions tab only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-engine
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Sync latest main
        run: git pull --rebase --autostash origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run engine
        run: python scripts/v6_expansion_engine.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          MAX_HOURS: 72
          MAX_TOP_BETS: 8
          MIN_BOOK_PRICES: 3
          MIN_EDGE_PCT: 1.5
          MIN_ODDS: 1.50
          MAX_ODDS: 2.40
          THE_ODDS_REGIONS: eu,uk,us,au
          THE_ODDS_MARKETS: h2h
          THE_ODDS_SPORTS: soccer_epl,soccer_spain_la_liga,soccer_germany_bundesliga,soccer_italy_serie_a,soccer_france_ligue_one,soccer_netherlands_eredivisie,soccer_uefa_champs_league
      - name: Apply V10 feedback
        run: python scripts/v10_apply_feedback.py
      - name: Apply strict mode
        run: python scripts/strict_mode.py
      - name: Commit engine outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A output/v6_expansion_engine.* output/odds_candidate_debug.json output/odds_cache_raw.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Update active engine outputs"
          git push
