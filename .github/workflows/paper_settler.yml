name: Paper Auto Settler

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/manual_result_patch.py'
      - 'scripts/paper_auto_settler.py'
      - 'scripts/strict_mode_migration_cleaner.py'
      - '.github/workflows/paper_settler.yml'
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: paper-settler
  cancel-in-progress: false

jobs:
  run-paper-auto-settler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Auto Settler
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/paper_auto_settler.py

      - name: Apply Manual Result Patch
        run: python scripts/manual_result_patch.py

      - name: Apply Strict Mode Migration Cleaner
        run: python scripts/strict_mode_migration_cleaner.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/paper_*.json output/paper_*.md output/manual_result_patch.md output/strict_mode_migration.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Update paper auto settler, manual patch and strict migration"
          git pull --rebase --autostash origin main
          git push
