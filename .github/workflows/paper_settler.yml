name: Paper Auto Settler

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */2 * * *'

permissions:
  contents: write

concurrency:
  group: paper-settler
  cancel-in-progress: true

jobs:
  run-paper-auto-settler:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main before processing
        run: git pull --rebase --autostash origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Validate engine freshness
        run: |
          python - <<EOF
          import json, pathlib, sys, datetime
          p = pathlib.Path('output/v6_expansion_engine.json')
          if not p.exists(): sys.exit('Missing engine output')
          data = json.loads(p.read_text())
          ts = data.get('generated_at')
          if not ts: sys.exit('Missing generated_at')
          dt = datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))
          age = (datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds() / 60
          if age > 60:
              sys.exit(f'Engine output too old: {age:.1f} minutes')
          print('Engine freshness OK')
          EOF

      - name: Add bets from engine
        run: python scripts/paper_tracker.py
        env:
          TRACKER_ADD_BETS: '1'

      - name: Run Auto Settler
        env:
          THE_ODDS_API_KEY: ''
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/paper_auto_settler.py

      - name: Apply Strict Mode Cleanup
        run: python scripts/strict_mode_migration_cleaner.py

      - name: Rebuild summary only (no new bets)
        run: python scripts/paper_tracker.py
        env:
          TRACKER_ADD_BETS: '0'

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A output/paper_*.json output/paper_*.md output/strict_mode_migration.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Stable paper update"
          git push
