name: Paper Settler V1

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-paper-settler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Paper Settler
        run: python scripts/paper_settler.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/paper_*.json output/paper_*.md || true
          git diff --cached --quiet || git commit -m "Update paper settler"
          git pull --rebase || true
          git push
