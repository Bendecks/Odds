name: V9 Feedback Loop

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-feedback
  cancel-in-progress: false

jobs:
  run-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/v9_performance_feedback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/v9_* || true
          git diff --cached --quiet && exit 0
          git commit -m "Update V9 feedback"
          git pull --rebase
          git push
