name: OCR Possible Bets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocr-possible-bets
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main
        run: git pull --rebase --autostash origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          pip install pillow pytesseract pypdf

      - name: Parse OCR/PDF possible bets inbox
        run: python scripts/ocr_possible_bets_parser.py
        env:
          OCR_MAX_FILES: 25
          # Conservative OCR/PDF safety defaults. These are not value/edge bets.
          # No hard max-pick cap here: risk is controlled by odds, confidence, time window and total stake cap.
          OCR_FINAL_MAX_PICKS: 25
          OCR_FINAL_MIN_ODDS: 1.55
          OCR_FINAL_MAX_ODDS: 2.10
          OCR_FINAL_ALLOW_DRAWS: 0
          OCR_FINAL_CONFIDENCE: high
          OCR_FINAL_SOON_HOURS: 12
          OCR_FINAL_MIN_START_MINUTES: 5
          OCR_BANKROLL_DKK: 100
          OCR_MAX_TOTAL_STAKE_PCT: 0.10
          OCR_MIN_STAKE_DKK: 1
          OCR_MAX_STAKE_DKK: 3
          OCR_TIMEZONE: Europe/Copenhagen

      - name: Cleanup old OCR inbox files
        run: python scripts/ocr_cleanup.py
        env:
          OCR_RETENTION_HOURS: 48
          OCR_CLEANUP_DRY_RUN: 0

      - name: Commit OCR outputs and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A inbox/possible_bets output/ocr_possible_bets_analysis.* output/ocr_cleanup_report.* output/ocr_final_picks.* || true
          git diff --cached --quiet && exit 0
          git commit -m "Process OCR possible bets inbox"
          git push
