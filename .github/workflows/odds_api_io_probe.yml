name: Odds API IO Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/odds_api_io_probe.py
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/odds_api_io_probe.* || true
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Update odds-api.io probe output"
          git pull --rebase origin main
          git push
