name: API Quota Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-quota-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main
        run: git pull --rebase --autostash origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check API quotas
        run: |
          python scripts/api_quota_check.py
          python scripts/api_football_poc_probe.py
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: Commit quota status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A output/api_quota_status.json output/api_quota_status.md output/api_football_poc_status.json output/api_football_poc_status.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Update API quota status"
          git push
