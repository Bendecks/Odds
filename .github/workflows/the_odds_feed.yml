name: The Odds reference feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: write
concurrency:
  group: the-odds-reference-feed
  cancel-in-progress: true
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch reference market, direct Bet365 prices and decide
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          MAX_HOURS: '72'
        run: |
          python scripts/the_odds_feed.py
          python scripts/odds_api_io_bet365.py
          python scripts/value_decision_engine.py
          python scripts/validation_report.py
      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_candidates.json output/latest_decision.json output/the_odds_feed_status.json output/bet365_join_status.json output/validation_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Update value engine feed"
          git pull --rebase --autostash
          git push
