name: Odds-API.io value feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: write
concurrency:
  group: odds-api-io-value-feed
  cancel-in-progress: true
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Plan Odds-API.io request budget
        run: python scripts/odds_api_io_quota_budget.py feed --requested-calls 80
      - name: Fetch Bet365 and Unibet from Odds-API.io and decide
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          MAX_HOURS: '72'
        run: |
          python scripts/odds_api_io_bootstrap.py
          python scripts/provider_schema_report.py
          python scripts/derived_btts_model.py
          python scripts/derived_goal_markets.py
          python scripts/derived_market_join.py
          python scripts/bet365_observation_freshness.py
          python scripts/market_coverage_report.py
          python scripts/identity_coverage_analysis.py
          python scripts/market_signal_candidates.py
          python scripts/observation_snapshot.py
          python scripts/value_decision_engine.py
          python scripts/decision_run_ledger.py
          python scripts/signal_ledger.py
          python scripts/closing_price_queue.py
          python scripts/closing_price_ledger.py
          python scripts/model_settlement_queue.py
          python scripts/validation_report.py
          python scripts/model_validation_readiness.py
          PYTHONPATH=scripts python scripts/operational_status.py
          PYTHONPATH=scripts python scripts/shadow_gate_analysis.py
      - name: Archive raw provider snapshot
        uses: actions/upload-artifact@v4
        with:
          name: odds-api-io-observations-${{ github.run_id }}
          path: |
            data/bet365_observations.jsonl
            data/unibet_observations.jsonl
          retention-days: 30
          compression-level: 9
      - name: Commit compact generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_candidates.json data/observation_snapshots.jsonl data/model_signals.jsonl data/model_closing_prices.jsonl data/decision_runs.jsonl output/bet365_market_summary.json output/bet365_selection_schema.json output/bet365_target_schema.json output/unibet_observer.json output/market_coverage_report.json output/identity_coverage_analysis.json output/market_signal_inventory.json output/signal_ledger_status.json output/decision_run_status.json output/closing_price_queue.json output/closing_price_status.json output/model_settlement_queue.json output/latest_decision.json output/bet365_join_status.json output/reference_match_diagnostics.json output/validation_report.json output/model_validation_readiness.json output/operational_status.json output/shadow_gate_analysis.json output/odds_api_io_quota_budget.json output/devig_shadow_comparison.json
          git diff --cached --quiet && exit 0
          git commit -m "Update value engine feed"
          git pull --rebase --autostash
          git push
